  <script>
    // Editor de mapas: só o mestre. Confere o papel no banco (modo Supabase) antes de abrir.
    (function () {
      function abrir() {
        if (!window.DBORoles || !DBORoles.isMaster()) return;
        document.documentElement.classList.add("mp-ativo");
        var cab = document.querySelector(".site-header");
        var medir = function () { if (cab) document.documentElement.style.setProperty("--mp-topo", Math.round(cab.getBoundingClientRect().bottom) + "px"); };
        medir();
        if (cab && window.ResizeObserver) new ResizeObserver(function () { medir(); window.dispatchEvent(new Event("resize")); }).observe(cab);
        DBOMapa.iniciar(document.getElementById("mapa-app"));
      }
      Promise.resolve(window.DBORoles && DBORoles.refresh ? DBORoles.refresh() : null).catch(function () {}).then(abrir);
    })();
  </script>
