  <!-- Modo debug: ficha de teste só do mestre, que roda no computador dele.
       Fica salva num arquivo JSON (ferramentas/debug-local/personagem-debug.json) pelo servidor ferramentas/servidor-debug.js.
       Sem o servidor, fica salva só neste navegador (e dá para exportar/importar o JSON). -->
  <div class="nimbus" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="index.html">Dragon Ball Omega</a>
      <nav aria-label="Principal">
        <ul class="nav">
          <li><a href="personagens.html">Personagens</a></li>
          <li><a href="enciclopedia.html">Enciclopédia</a></li>
          <li><a href="campanha.html">Campanha</a></li>
        </ul>
      </nav>
      <a class="icon-btn" href="configuracoes.html" aria-label="Configurações" title="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
      </a>
    </div>
  </header>

  <main class="page">
    <div class="wrap wrap--wide">
      <section id="dbg-lock" class="panel dbg-lock" hidden>
        <h1 id="dbg-lock-title">Essa página é só do mestre</h1>
        <p id="dbg-lock-text"></p>
        <a class="btn" href="personagens.html">Voltar para Personagens</a>
      </section>

      <div id="dbg-app" hidden>
        <div class="dbg-band" role="note">
          <p><strong>Modo debug.</strong> Personagem só para teste: o nível sobe e desce à vontade, nada gasta TP e nenhuma técnica tem limite de inventário, de classe ou de sub-raça.
            <span id="dbg-save" class="dbg-save"></span></p>
          <div class="dbg-band__acts">
            <button id="dbg-export" class="btn btn--ghost dbg-sm" type="button">Exportar JSON</button>
            <label class="btn btn--ghost dbg-sm">Importar JSON<input id="dbg-import" class="sr-only" type="file" accept="application/json,.json"></label>
            <button id="dbg-reset" class="btn dbg-sm dbg-danger" type="button">Resetar</button>
          </div>
        </div>
        <div class="dbg-grid">
          <div id="dbg-left" class="dbg-col"></div>
          <div class="dbg-col">
            <div id="dbg-tabs" class="dbg-tabs" role="tablist" aria-label="Seções da ficha"></div>
            <div id="dbg-right"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" popover="manual" role="alert"></div>
